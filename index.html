<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="./assets/js/script.js" defer></script>
    <title>WebChat</title>
</head>
<body>
    <main>
        <header class="header_reglage">
            <h1>DevChat</h1>
            <!-- <button class="header_reglage_bouton" id="header_bouton">⚙️</button> -->
        </header>
        <article class="message">
            <section class="message__affichage">

            </section>
            <form action="" class="message__form">
                <textarea spellcheck="true" id="message" required placeholder="Mets ton message ici"></textarea>
                <button type="button" id="send">Send</button>
            </form>
        </article>
        <aside class="conv">
            <header class="conv_header">
                Conv
            </header>
            <section>
                <ul>
                    <li>ajout pseudo</li>
                    <li>gestion des message</li>
                </ul>
            </section>
        </aside>
    </main>
    <dialog id="boxForm">
        <form action="">
            <label for="pseudoBox">Pseudo : </label>
            <input type="text"  id="pseudoBox" placeholder="Votre pseudo">
            <button type="button" id="btnBox">Valider</button>
        </form>
    </dialog>
</body>
</html>
